version: "3.9"

services:
  backend:
    build:
      context: ../qognition-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"\]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../qognition-ui
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

